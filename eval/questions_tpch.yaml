  - id: t20
    question: "What are the distinct order statuses and how many orders have each status?"
    reference_sql: |
      SELECT O_ORDERSTATUS, COUNT(*) AS order_count
      FROM SNOWFLAKE_SAMPLE_DATA.TPCH_SF1.ORDERS
      GROUP BY O_ORDERSTATUS ORDER BY O_ORDERSTATUS
    expected: null
    expected_status: answered
    notes: "Order statuses are F (fulfilled), O (open), P (partial)."

